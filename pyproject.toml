[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bog-simulator"
version = "1.1.0"
description = "A Boil-Off Gas (BOG) simulator for LNG Carriers with membrane containment tanks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ioannis Fountis" }
]
keywords = [
    "lng",
    "lng-carrier",
    "boil-off-gas",
    "bog",
    "simulation",
    "thermodynamics",
    "hydrodynamics",
    "marine-engineering"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License"
    "Intended Audience :: Science/Research/Education",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
]

[project.scripts]
bog-simulator = "bog_simulator.__main__:main"
bog-sim = "bog_simulator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short"
